<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Dynamic Background -->
    <div class="bg-layer" id="bgLayer"></div>
    <div class="star-layer"></div>

    <div class="app-container">
        
        <!-- Search Overlay (Hidden by default) -->
        <div class="search-overlay hidden" id="searchOverlay">
            <div class="search-bar">
                <i class="ph ph-magnifying-glass"></i>
                <input type="text" id="cityInput" placeholder="Enter city name">
                <button id="closeSearch"><i class="ph ph-x"></i></button>
            </div>
            <div class="search-results" id="searchResults"></div>
        </div>

        <!-- Main Content -->
        <main class="main-view" id="mainView">
            
            <!-- Context Header -->
            <header class="top-bar">
                <button class="icon-btn mobile-only" id="plusBtn"><i class="ph ph-list"></i></button>
                
                <div class="location-info">
                    <span id="cityName">New York</span>
                    <i class="ph ph-navigation-arrow"></i>
                </div>

                <!-- Desktop Search (Visible on Desktop) -->
                <div class="desktop-search">
                    <i class="ph ph-magnifying-glass"></i>
                    <input type="text" id="desktopSearchInput" placeholder="Search city...">
                </div>

                <button class="icon-btn mobile-only" id="searchTrigger"><i class="ph ph-magnifying-glass"></i></button>
            </header>

            <!-- Hero Section -->
            <section class="hero-section">
                <!-- Date/Time pill logic can go here or above -->
                <div class="hero-temp">
                    <span id="tempValue">--</span><span class="degree">°</span>
                </div>
                <div class="hero-condition" id="weatherDesc">--</div>
                <div class="hero-high-low">
                    <span><i class="ph ph-arrow-up"></i> <span id="maxTemp">--</span>°</span>
                    <span><i class="ph ph-arrow-down"></i> <span id="minTemp">--</span>°</span>
                </div>
                <!-- <div class="hero-feels">Feels like <span id="feelsLike">--</span>°</div> -->
                <div class="hero-summary" id="dailySummary">
                    --
                </div>
            </section>

            <!-- Hourly Scroll -->
            <section class="widget-container hourly-widget">
                <!-- Graph SVG Overlay (Optional, complex to impl perfectly in vanilla without lib, will simulate) -->
                <div class="hourly-list" id="hourlyList">
                    <!-- JS Injected -->
                </div>
                <div class="widget-footer-link">
                    <span>Hourly forecast</span>
                    <i class="ph ph-caret-right"></i>
                </div>
            </section>

            <!-- Tomorrow Outlook -->
            <section class="widget-container outlook-widget">
                <div class="outlook-content">
                    <div class="outlook-text" id="outlookText">--</div>
                </div>
                <div class="pagination-dots">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </section>

            <!-- Daily List -->
            <section class="widget-container daily-widget">
                <div class="daily-list" id="dailyList">
                    <!-- JS injected -->
                </div>
                <div class="widget-footer-link">
                    <span>5-day forecast</span>
                    <i class="ph ph-caret-right"></i>
                </div>
            </section>

            <!-- Activity / AQI / Pollen Stack -->
            <section class="widget-container activity-aqi-stack">
                
                <!-- Activity Card -->
                <div class="info-card activity-card">
                    <div class="card-header">Running</div>
                    <div class="activity-content">
                        <div class="activity-icon"><i class="ph ph-sneaker-move"></i></div>
                        <div class="activity-details">
                            <span class="status-text" id="runStatus">--</span>
                            <span class="status-desc" id="runDesc">--</span>
                        </div>
                        <div class="activity-rating">
                            <i class="ph ph-smiley-meh" id="runFace"></i>
                            <span id="runRating">--</span>
                        </div>
                    </div>
                </div>

                <!-- AQI Card -->
                <div class="info-card aqi-card">
                    <div class="card-header">
                        <span>AQI</span>
                        <i class="ph ph-info"></i>
                    </div>
                    <div class="aqi-main">
                        <span id="aqiStatus">--</span>
                        <span class="aqi-num" id="aqiVal">--</span>
                    </div>
                    <div class="aqi-bar-container">
                        <div class="aqi-track"></div>
                        <div class="aqi-fill" id="aqiFill"></div>
                    </div>
                </div>

                <!-- Pollen (Estimated) -->
                <div class="info-card pollen-card">
                    <div class="card-header">Pollen</div>
                    <div class="pollen-grid">
                        <div class="pollen-item">
                            <i class="ph ph-tree" id="treeIcon"></i>
                            <span class="p-name">Tree</span>
                            <span class="p-val" id="treePollen">--</span>
                        </div>
                        <div class="pollen-item">
                            <i class="ph ph-plant" id="grassIcon"></i>
                            <span class="p-name">Grass</span>
                            <span class="p-val" id="grassPollen">--</span>
                        </div>
                        <div class="pollen-item">
                            <i class="ph ph-flower" id="ragweedIcon"></i>
                            <span class="p-name">Ragweed</span>
                            <span class="p-val" id="ragweedPollen">--</span>
                        </div>
                    </div>
                </div>

            </section>

            <!-- Details Grid -->
            <section class="details-grid-container">
                <!-- UV -->
                <div class="detail-box">
                    <div class="d-head"><i class="ph ph-sun"></i> UV index</div>
                    <div class="d-big" id="uvLevel">Low</div>
                    <div class="d-sub" id="uvDesc">Low risk of harm</div>
                    <div class="uv-bar"><div class="uv-dot" id="uvDot" style="left: 0%"></div></div>
                </div>

                <!-- Humidity -->
                <div class="detail-box">
                    <div class="d-head"><i class="ph ph-drop"></i> Humidity</div>
                    <div class="d-big"><span id="humidVal">--</span>%</div>
                    <div class="d-sub" id="humidDesc">--</div>
                    <div class="humid-bar"><div class="humid-fill" id="humidFill" style="width: 0%"></div></div>
                </div>

                <!-- Wind -->
                <div class="detail-box">
                    <div class="d-head"><i class="ph ph-wind"></i> Wind</div>
                    <div class="wind-wrapper">
                        <div class="compass">
                            <span class="dir n">N</span>
                            <span class="dir e">E</span>
                            <span class="dir s">S</span>
                            <span class="dir w">W</span>
                            <div class="compass-arrow-container" id="compassArrow">
                                <i class="ph ph-arrow-up"></i>
                            </div>
                            <div class="wind-center">
                                <span id="windVal">--</span>
                                <small>km/h</small>
                            </div>
                        </div>
                    </div>
                    <div class="d-sub text-center" id="windDesc">It's calm</div>
                </div>

                <!-- Dew Point -->
                <div class="detail-box">
                    <div class="d-head"><i class="ph ph-drop-half"></i> Dew point</div>
                    <div class="d-big"><span id="dewVal">--</span>°</div>
                    <div class="d-sub" id="dewDesc">--</div>
                </div>
            </section>

            <footer class="bottom-spacer"></footer>
        </main>
        
        <!-- Chat FAB -->
        <button class="chat-fab" id="chatFab">
            <i class="ph ph-sparkle"></i>
        </button>

        <!-- Chat Modal -->
        <div class="chat-modal" id="chatModal">
             <div class="chat-head">
                 <div class="chat-title">
                     <span>Weather Assistant</span>
                     <small>AI Powered 🤖</small>
                 </div>
                 <button class="close-chat" id="closeChat"><i class="ph ph-caret-down"></i></button>
             </div>
             <div class="chat-body" id="chatMessages">
                 <div class="chat-bubble ai">Hi! Check the latest forecast above.</div>
             </div>
             <div class="chat-foot">
                 <input type="text" id="chatInput" placeholder="Ask details...">
                 <button id="sendMessage"><i class="ph ph-paper-plane-right"></i></button>
             </div>
        </div>
    </div>
    
    <script type="module" src="script.js"></script>
</body>
</html>
